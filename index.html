<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dear Astrid</title>
<meta property="og:title" content="Dear Astrid, will you be my girlfriend?" />
<meta property="og:description" content="There is only one answer." />
<style>
  :root { --pink: #ff6b9d; --deep: #d64177; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #ffe3ef 0%, #ffd0e4 50%, #ffc0dd 100%);
    color: var(--deep);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  .card {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 28px;
    padding: 44px 32px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 18px 50px rgba(214, 65, 119, 0.25);
    position: relative;
    z-index: 2;
  }
  h1 { font-size: clamp(1.7rem, 5vw, 2.6rem); margin: 0 0 8px; line-height: 1.2; }
  p.sub { margin: 0 0 28px; font-size: 1.05rem; opacity: 0.75; }
  .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 1.15rem;
    font-weight: bold;
    color: #fff;
    background: var(--pink);
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(255, 107, 157, 0.45);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button:hover { transform: translateY(-3px) scale(1.04); background: var(--deep); }
  button:active { transform: scale(0.97); }
  .heart {
    position: fixed;
    top: -40px;
    font-size: 24px;
    animation: fall linear forwards;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
  }
  .final h1 { font-size: clamp(2rem, 6vw, 3rem); }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="question">Dear Astrid,<br />will you be my girlfriend?</h1>
    <p class="sub" id="sub">Choose carefully.</p>
    <div class="buttons" id="buttons">
      <button type="button">Yes</button>
      <button type="button">Yes</button>
    </div>
  </div>

<script>
  const steps = [
    { question: "Are you sure?", sub: "Take your time." },
    { question: "Are you sure sure?", sub: "Last chance to be extremely sure." }
  ];

  let step = 0;
  const card = document.getElementById("card");
  const question = document.getElementById("question");
  const sub = document.getElementById("sub");
  const buttons = document.getElementById("buttons");

  function rain(count) {
    for (let i = 0; i < count; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["💖", "💕", "💗", "🩷", "❤️"][i % 5];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 3 + Math.random() * 3 + "s";
      heart.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9000);
    }
  }

  function advance() {
    if (step < steps.length) {
      question.textContent = steps[step].question;
      sub.textContent = steps[step].sub;
      step++;
      rain(8);
      return;
    }
    card.classList.add("final");
    question.textContent = "Yay! 💖";
    sub.textContent = "It's official: Astrid said yes (twice, and then some).";
    buttons.remove();
    rain(60);
  }

  buttons.addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON") advance();
  });
</script>
</body>
</html>
